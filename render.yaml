services:
  - type: web
    name: sewnet-api
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build:api
    startCommand: npm run start:api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTO_MIGRATE
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        value: VgSHVwtSV5J7Rdwgz1EF5DlZLvMPbfYa
      - key: BETTER_AUTH_URL
        value: https://sewnet-api.onrender.com
      - key: WEB_ORIGIN
        value: https://miniature-octo-invention-rouge.vercel.app
